name: Question
description: Ask for help when GitHub Discussions is not available
title: "[Question]: "
labels: ["question"]
assignees: []
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What would you like to understand or accomplish?
      placeholder: State one focused question.
    validations:
      required: true

  - type: textarea
    id: attempted
    attributes:
      label: What have you tried?
      description: Include relevant documentation, commands, or approaches you already checked.
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add versions, examples, or links that help explain the question.
    validations:
      required: false
