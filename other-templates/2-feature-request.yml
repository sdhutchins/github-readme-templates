name: Feature request
description: Propose an improvement or new capability
title: "[Feature]: "
labels: ["enhancement"]
assignees: []
body:
  - type: checkboxes
    id: preliminary_checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched the existing issues for a similar request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What problem would this change solve, and who experiences it?
      placeholder: Describe the current limitation or unmet need.
    validations:
      required: true

  - type: textarea
    id: desired_outcome
    attributes:
      label: Desired outcome
      description: What should a successful solution make possible?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe an implementation if you have one in mind.
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe workarounds or alternative approaches you considered.
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add examples, mockups, references, or constraints.
    validations:
      required: false
