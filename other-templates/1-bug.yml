name: Bug report
description: Report a reproducible problem
title: "[Bug]: "
labels: ["bug"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve the project. Remove credentials, personal
        information, and other sensitive data before submitting this form.

  - type: checkboxes
    id: preliminary_checks
    attributes:
      label: Preliminary checks
      options:
        - label: I searched the existing issues for the same problem.
          required: true
        - label: I removed sensitive information from this report.
          required: true

  - type: textarea
    id: description
    attributes:
      label: Problem
      description: What happened, and what were you trying to do?
      placeholder: Describe the problem and its impact.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest commands or example that reproduces the problem.
      placeholder: |
        1. Run ...
        2. Provide ...
        3. Observe ...
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the software version, operating system, runtime, and installation method.
      placeholder: |
        - Project version or commit:
        - Operating system:
        - Runtime version:
        - Installation method:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Paste the complete relevant error or log output.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add links, screenshots, or other information that may help.
    validations:
      required: false
